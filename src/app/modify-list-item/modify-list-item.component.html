<form [formGroup]="foodForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="ProductID">ID</label>
    <input type="number" id="ProductID" formControlName="ProductID" />
  </div>

  <div class="form-group">
    <label for="Brand">Brand</label>
    <input type="text" id="Brand" formControlName="Brand" />
  </div>

  <div class="form-group">
    <label for="ItemName">Name</label>
    <input type="text" id="ItemName" formControlName="ItemName" />
  </div>
  <div class="form-group">
    <label for="ExpiryDate">Expiry Date</label>
    <input type="text" id="ExpiryDate" formControlName="ExpiryDate" />
  </div>


  <div class="form-group">
    <label for="Barcode">Barcode</label>
      <input type="text" id="Barcode" formControlName="Barcode"  />
    </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>
  <button type="submit">Add</button>

</form>
